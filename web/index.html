<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#15803d" />
    <title>Flyer2Recipes</title>
    <script>
      // If the app can't start (an older browser, a script error), say so instead of a blank page.
      (function () {
        function show(msg) {
          var root = document.getElementById('root')
          if (!root || root.childElementCount) return
          root.innerHTML =
            '<div style="font-family:system-ui,sans-serif;max-width:28rem;margin:3rem auto;padding:1.25rem;border-radius:1rem;background:#fff7ed;color:#7c2d12">' +
            '<p style="font-weight:600;margin:0 0 .5rem">This page couldn\'t start in your browser.</p>' +
            '<p style="margin:0 0 .5rem">Updating your phone or browser usually fixes it. If it doesn\'t, send us this message:</p>' +
            '<code style="display:block;white-space:pre-wrap;font-size:.8rem;color:#9a3412"></code></div>'
          root.querySelector('code').textContent = String(msg || 'Unknown error') + '\n' + navigator.userAgent
        }
        window.addEventListener('error', function (e) { show(e.message) })
        window.addEventListener('unhandledrejection', function (e) { show(e.reason && (e.reason.message || e.reason)) })
        window.__appStartTimer = setTimeout(function () { show('The app did not start within 15 seconds.') }, 15000)
      })()
    </script>
    <script nomodule>
      document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('root').textContent = 'This page needs a newer browser. Please update your phone or browser.'
      })
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
