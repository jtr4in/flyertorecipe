name: Probe Flipp app links (temporary)
on: [push]
permissions:
  contents: write
jobs:
  probe:
    if: github.event.head_commit.message == 'probe flipp app links 3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe; : > probe/out.txt
          UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          curl -sL -A "$UA" -m 20 "https://flipp.com/en-ca/item/1052628260?postal_code=K4A1A1" -o /tmp/item.html
          grep -oE "(src|href)=[\"'][^\"']+\.js" /tmp/item.html | head >> probe/out.txt
          for js in $(grep -oE "(src|href)=[\"'][^\"']+\.js" /tmp/item.html | sed -E "s/^(src|href)=[\"']//" | sort -u); do
            case "$js" in http*) u="$js";; *) u="https://flipp.com/${js#/}";; esac
            curl -sL -m 30 "$u" -o /tmp/b.js; echo "== $u $(wc -c </tmp/b.js)" >> probe/out.txt
            grep -oE '.{0,160}(/action\?|"/action|flipp://|onelink\.me|page\.link|deeplink|deep_link|openInApp|open_in_app).{0,160}' /tmp/b.js | head -40 >> probe/out.txt
          done
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -m "probe output"; git pull --rebase origin main; git push origin HEAD:main
