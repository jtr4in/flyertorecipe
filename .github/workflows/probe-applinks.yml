name: Probe Flipp app links (temporary)
on: [push]
permissions:
  contents: write
jobs:
  probe:
    if: github.event.head_commit.message == 'probe flipp app links'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe; UA='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          for u in https://flipp.com/.well-known/apple-app-site-association https://flipp.com/apple-app-site-association https://flipp.com/.well-known/assetlinks.json https://www.flipp.com/.well-known/apple-app-site-association https://share.flipp.com/.well-known/apple-app-site-association https://flipp.app.link/.well-known/apple-app-site-association https://flipp.page.link/.well-known/apple-app-site-association; do
            echo "== $u" >> probe/out.txt; curl -sL -A "$UA" -m 20 -w "\nHTTP %{http_code} %{content_type}\n" "$u" | head -c 4000 >> probe/out.txt; echo >> probe/out.txt; done
          echo "== item page meta" >> probe/out.txt
          ID=$(curl -s "https://backflipp.wishabi.com/flipp/items/search?locale=en-ca&postal_code=K4A1A1&q=eggs" | python3 -c "import json,sys;print(json.load(sys.stdin)['items'][0]['id'])")
          echo "id $ID" >> probe/out.txt
          curl -sL -A "$UA" -m 20 "https://flipp.com/en-ca/item/$ID?postal_code=K4A1A1" | grep -oiE '<meta[^>]+(al:|app-argument|apple-itunes|twitter:app|branch|deeplink|deep_link)[^>]*>|flipp://[^"'"'"' ]+|wishabi://[^"'"'"' ]+|[a-z]+\.app\.link[^"'"'"' ]*' | sort -u | head -50 >> probe/out.txt
          curl -sL -A "$UA" -m 20 "https://flipp.com/en-ca/item/$ID?postal_code=K4A1A1" -o probe/item.html; wc -c probe/item.html >> probe/out.txt
          grep -oiE '"[a-z]+://[^"]{0,80}' probe/item.html | grep -viE 'https?://' | sort -u | head -30 >> probe/out.txt
          rm probe/item.html
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -m "probe output"; git pull --rebase origin main; git push origin HEAD:main
