name: Probe Flipp share link (temporary)
on: [push]
permissions:
  contents: write
jobs:
  probe:
    if: github.event.head_commit.message == 'probe flipp share link'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p probe; : > probe/out.txt
          A='Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Mobile Safari/537.36'
          I='Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1'
          for ua in "$A" "$I" "curl/8"; do
            echo "===== UA $ua" >> probe/out.txt
            curl -s -m 20 -A "$ua" -D - -o /tmp/b.html "https://click.flipp.com/h8pE/n4wklxot" | grep -iE '^(HTTP|location)' >> probe/out.txt
            grep -oE '(flipp://|intent://|wishabi://|deep_link[a-z_]*|af_dp|af_web_dp|af_android_url|af_ios_url|https?://[a-z.]*flipp\.com)[^"'"'"' <>]{0,400}' /tmp/b.html | sort -u | head -30 >> probe/out.txt
          done
          echo "===== resolver" >> probe/out.txt
          curl -s -m 20 "https://onelink.appsflyer.com/shortlink/v1/h8pE?id=n4wklxot" >> probe/out.txt || true
          curl -sL -m 20 -A "$A" "https://click.flipp.com/h8pE/n4wklxot" -o /tmp/full.html; wc -c /tmp/full.html >> probe/out.txt
          head -c 3000 /tmp/full.html >> probe/out.txt
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe; git commit -m "probe output"; git pull --rebase origin main; git push origin HEAD:main
