# Temporary: check which of this week's stored deals open in Flipp. Commits its findings.
name: Flipp link probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Location fields
        run: |
          python3 - <<'PY' > /tmp/head.txt
          import json, urllib.request
          for pc in ("K4A1A1", "M5V2T6", "K1E0A1"):
              d = json.load(urllib.request.urlopen(urllib.request.Request(f"https://backflipp.wishabi.com/flipp/data?locale=en-ca&postal_code={pc}", headers={"User-Agent": "Mozilla/5.0"})))
              print(pc, "keys", sorted(d.keys()))
              for k, v in d.items():
                  if k != "flyers": print("  ", k, json.dumps(v)[:300])
          PY
          echo '[{"dealId":"f1048227931","merchant":"FreshCo","name":"Hersheys"}]' > /tmp/sample.json
      - name: Open each in a phone browser
        run: |
          mkdir -p /tmp/p && cd /tmp/p && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install chromium >/dev/null
          cat > probe.mjs <<'JS'
          import { chromium, devices } from 'playwright'
          import fs from 'fs'
          const sample = JSON.parse(fs.readFileSync('/tmp/sample.json'))
          const out = [fs.readFileSync('/tmp/head.txt', 'utf8')]
          const b = await chromium.launch()
          const p = await b.newPage({ ...devices['Pixel 7'] })
          for (const d of sample) {
            const id = d.dealId.slice(1)
            for (const u of [`https://flipp.com/en-ca/flyers/item/${id}?postal_code=K4A1A1`, `https://flipp.com/en-ca/item/${id}?postal_code=K4A1A1`, `https://flipp.com/en-ca/ottawa-on/item/${id}`, `https://flipp.com/en-ca/k4a1a1/item/${id}`, `https://flipp.com/en-ca/toronto-on/item/${id}`]) {
              try { await p.goto(u, { waitUntil: 'networkidle', timeout: 45000 }) } catch (e) {}
              await p.waitForTimeout(2500)
              const text = (await p.locator('body').innerText()).replace(/\s+/g, ' ')
              const ok = !/stores\/undefined/.test(p.url()) && !/expired/i.test(text)
              out.push(`${ok ? 'OK ' : 'BAD'} ${d.merchant} | ${d.name} | ${u} -> ${p.url()} | ${text.match(/This item is expired[^.]*|Valid [A-Z][a-z]{2} \d+, \d{4} – [A-Z][a-z]{2} \d+, \d{4}/)?.[0] || ''}`)
            }
          }
          fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/backend/data/flipp_probe.txt`, out.join('\n'))
          await b.close()
          JS
          node probe.mjs || true
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"; git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add backend/data/flipp_probe.txt && git commit -m "Flipp link probe results" && git push
