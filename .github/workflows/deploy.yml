# Builds the web app and publishes it to GitHub Pages.
# Firestore rules (firestore.rules) are pasted into the Firebase console, or deployed with
# `firebase deploy --only firestore:rules`; the Admin SDK key can't deploy them.
# One-time setup: repo Settings > Pages > Source: "GitHub Actions".
# Firebase web config comes from web/.env.production (public identifiers, safe to commit).
name: Deploy web app
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

