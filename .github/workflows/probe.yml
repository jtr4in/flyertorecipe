# Temporary: render flyer clippings with the app's tile maths in a real browser.
name: Probe flyer item
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir out
          cd backend && python -c "
          import json; from flyer_clips import flyer_index
          idx = flyer_index('K1E 0A1'); pick = [idx[k] for k in ['436395910', '436432562'] if k in idx] + list(idx.values())[::900][:3]
          json.dump(pick, open('../out/pick.json', 'w'))"
          cd .. && cp web/src/lib/flyerClip.js out/flyerClip.mjs && cd out && node --input-type=module -e "
          import { clipTiles } from './flyerClip.mjs'; import fs from 'fs'
          const pick = JSON.parse(fs.readFileSync('pick.json'))
          const html = pick.map((p) => { const { tiles, aspect } = clipTiles(p.clip)
            return '<div style=\"width:380px;margin:8px;display:inline-block;vertical-align:top\"><div style=\"position:relative;overflow:hidden;aspect-ratio:' + aspect + '\">' +
              tiles.map((x) => '<img src=\"' + x.src + '\" style=\"position:absolute;max-width:none;left:' + x.left + '%;top:' + x.top + '%;width:' + (x.width + 0.05) + '%;height:' + (x.height + 0.05) + '%\">').join('') + '</div></div>' }).join('')
          fs.writeFileSync('clips.html', '<body style=\"margin:0;background:#ddd\">' + html + '</body>')"
          google-chrome --headless=new --no-sandbox --window-size=1200,1400 --virtual-time-budget=15000 --screenshot=clips.png "file://$PWD/clips.html"
          git init -q && git checkout -q -b probe-out && git add . && git -c user.name=probe -c user.email=probe@example.com commit -qm probe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-out
