# Flyer Meal recipe library. Builds web/public/flyermeal/recipes.json from TheMealDB's catalogue,
# the dishes picked in backend/flyermeal_common.json and our own classics (with Wikipedia photos),
# and commits it, so the app reads a stored file and never calls a recipe API per user.
# Only new recipes and photos are fetched on later runs.
name: Flyer Meal recipes
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Re-download every recipe instead of only new ones
        type: boolean
        default: false
      candidates:
        description: Only list Commons photos for each classic (prints to the log, commits nothing)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["backend/flyermeal_*", "backend/data/mealdb_all.json"]
  schedule:
    - cron: "0 9 1 * *" # monthly: TheMealDB adds recipes slowly

permissions:
  contents: write
  actions: write # to start a site deploy after committing

concurrency:
  group: flyermeal-recipes

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: List photo candidates
        if: inputs.candidates
        run: python backend/flyermeal_recipes.py --candidates
      - name: Fetch new recipes and photos
        if: ${{ !inputs.candidates }}
        run: python backend/flyermeal_recipes.py ${{ inputs.refresh && '--refresh' || '' }}
      - name: Commit
        if: ${{ !inputs.candidates }}
        run: |
          git add web/public/flyermeal/recipes.json backend/data
          if git diff --cached --quiet; then echo "No new recipes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Flyer Meal: update recipe library"
          git pull --rebase origin main
          git push origin HEAD:main
          # A push made with this workflow's token doesn't start other workflows, so ask for the deploy.
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
